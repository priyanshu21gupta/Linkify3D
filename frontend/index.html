<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Linkify 3D - URL Shortener</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">

        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>

    </div>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                🔗
            </div>

            <div>

                <h1>
                    Linkify<span>3D</span>
                </h1>

                <p>
                    Smart URL Shortener
                </p>

            </div>

        </div>


        <div class="header-actions">

            <button
                id="themeBtn"
                class="theme-btn">

                🌙

            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>


        <!-- ================= HERO ================= -->

        <section class="hero">

            <h2>
                Make Your Links
                <span>Short & Smart</span>
            </h2>

            <p>
                Transform long URLs into short,
                shareable links.
            </p>

        </section>


        <!-- ================= SHORTENER CARD ================= -->

        <section class="shortener-card tilt-card">


            <div class="card-header">

                <div>

                    <h3>
                        🔗 Create Short Link
                    </h3>

                    <p>
                        Paste your long URL below
                    </p>

                </div>


                <div class="status">

                    <span></span>

                    Online

                </div>

            </div>


            <!-- ================= FORM ================= -->

            <form id="urlForm">


                <!-- URL -->

                <label>
                    Long URL
                </label>


                <div class="input-wrapper">

                    <span>
                        🌐
                    </span>

                    <input
                        type="url"
                        id="longUrl"
                        placeholder="https://example.com/very-long-url..."
                        required>

                </div>


                <!-- OPTIONS -->

                <div class="options">


                    <div>

                        <label>
                            Custom Alias
                        </label>

                        <input
                            type="text"
                            id="customAlias"
                            placeholder="my-link">

                    </div>


                    <div>

                        <label>
                            Expiry
                        </label>

                        <select id="expiry">

                            <option value="never">
                                Never
                            </option>

                            <option value="1">
                                1 Day
                            </option>

                            <option value="7">
                                7 Days
                            </option>

                            <option value="30">
                                30 Days
                            </option>

                            <option value="90">
                                90 Days
                            </option>

                        </select>

                    </div>

                </div>


                <!-- SHORTEN BUTTON -->

                <button
                    type="submit"
                    class="shorten-btn">

                    <span>
                        ⚡
                    </span>

                    Shorten URL

                </button>

            </form>


            <!-- ================= RESULT ================= -->

            <div
                id="resultBox"
                class="result-box hidden">


                <div class="result-title">

                    ✅ Your Short URL

                </div>


                <div class="result-url">

                    <span id="shortUrl"></span>


                    <button
                        id="copyBtn">

                        📋

                    </button>

                </div>


                <div class="result-actions">

                    <button id="qrBtn">
                        ▣ QR Code
                    </button>

                    <button id="shareBtn">
                        ↗ Share
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= QR MODAL ================= -->

    <div
        id="qrModal"
        class="modal hidden">


        <div class="modal-content">


            <button
                id="closeModal"
                class="close-btn">

                ✕

            </button>


            <h2>
                QR Code
            </h2>


            <p>
                Scan to open your short link
            </p>


            <div
                id="qrcode">
            </div>


            <button
                id="downloadQR"
                class="download-btn">

                ⬇ Download QR

            </button>

        </div>

    </div>


    <!-- ================= TOAST ================= -->

    <div
        id="toast"
        class="toast">

        Message

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
